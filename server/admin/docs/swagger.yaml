basePath: /
definitions:
  admin.accountInfo:
    properties:
      role:
        example: superuser
        type: string
      username:
        example: jtorres
        type: string
    type: object
  admin.accountView:
    properties:
      createdAt:
        type: string
      disabled:
        example: false
        type: boolean
      role:
        example: operator
        type: string
      username:
        example: operador
        type: string
    type: object
  admin.createAccountBody:
    properties:
      password:
        example: a-password-of-12-or-more
        type: string
      role:
        example: operator
        type: string
      username:
        example: operador
        type: string
    type: object
  admin.dailyConsumption:
    properties:
      BytesUsed:
        example: 1048576
        type: integer
      CreatedAt:
        type: string
      Date:
        type: string
      Domain:
        example: robot.example.com
        type: string
      ID:
        example: 12
        type: integer
      Month:
        example: 2026-11
        type: string
      UpdatedAt:
        type: string
    type: object
  admin.domainChangeBody:
    properties:
      allowMultipleConnections:
        type: boolean
      allowedCidrs:
        items:
          type: string
        type: array
      apiKey:
        type: string
      authLatched:
        example: false
        type: boolean
      passthrough:
        type: boolean
    type: object
  admin.domainCreateBody:
    properties:
      allowMultipleConnections:
        example: true
        type: boolean
      allowedCidrs:
        example:
        - 10.0.0.0/8
        - 192.168.1.7
        items:
          type: string
        type: array
      apiKey:
        example: clave-del-cliente-de-al-menos-32-caracteres
        type: string
      bandwidthBytesPerSecond:
        example: 0
        type: integer
      monthlyQuotaBytes:
        example: 0
        type: integer
      name:
        example: robot.example.com
        type: string
      passthrough:
        example: false
        type: boolean
    type: object
  admin.domainView:
    properties:
      allowMultipleConnections:
        type: boolean
      allowedCidrs:
        items:
          type: string
        type: array
      authLatched:
        type: boolean
      bandwidthBytesPerSecond:
        type: integer
      id:
        type: integer
      monthlyQuotaBytes:
        type: integer
      name:
        type: string
      passthrough:
        type: boolean
    type: object
  admin.errorResponse:
    properties:
      error:
        example: message describing what went wrong
        type: string
    type: object
  admin.healthResponse:
    properties:
      checks:
        additionalProperties:
          type: string
        type: object
      status:
        example: ok
        type: string
    type: object
  admin.loginBody:
    properties:
      password:
        example: a-long-password
        type: string
      username:
        example: jtorres
        type: string
    type: object
  admin.loginResponse:
    properties:
      expiresAt:
        type: string
      token:
        example: q8Vx2nqT1sK9wEZl0cHjR3pYb7LmUo4aGdNfXiTr5Ys
        type: string
      username:
        example: jtorres
        type: string
    type: object
  admin.ownPasswordBody:
    properties:
      currentPassword:
        example: the-password-you-have-now
        type: string
      newPassword:
        example: a-password-of-12-or-more
        type: string
    type: object
  admin.passwordBody:
    properties:
      password:
        example: a-password-of-12-or-more
        type: string
    type: object
  admin.roleBody:
    properties:
      role:
        example: operator
        type: string
    type: object
  admin.statusResponse:
    properties:
      status:
        example: ok
        type: string
    type: object
  admin.trafficResponse:
    properties:
      consumptions:
        items:
          $ref: '#/definitions/admin.dailyConsumption'
        type: array
      domain:
        example: robot.example.com
        type: string
      from:
        example: "2026-11-01"
        type: string
      to:
        example: "2026-11-30"
        type: string
    type: object
  admin.visitorTokenBody:
    properties:
      methods:
        items:
          type: string
        type: array
      name:
        type: string
      pathPrefixes:
        items:
          type: string
        type: array
    type: object
  admin.visitorTokenCreated:
    properties:
      name:
        example: reader
        type: string
      note:
        example: shown once; store it now
        type: string
      token:
        example: q8Vx2nqT1sK9wEZl0cHjR3pYb7LmUo4aGdNfXiTr5Ys
        type: string
    type: object
  admin.visitorTokenItem:
    properties:
      createdAt:
        type: string
      id:
        example: 3
        type: integer
      methods:
        example: GET,HEAD
        type: string
      name:
        example: reader
        type: string
      pathPrefixes:
        example: /api,/public
        type: string
      revoked:
        example: false
        type: boolean
    type: object
  admin.visitorUserBody:
    properties:
      secret:
        description: Secret is optional. If it is omitted, the server generates one
          and returns it once.
        type: string
      username:
        type: string
    type: object
  admin.visitorUserResponse:
    properties:
      secret:
        example: V_adFY98sN6seUTCMqf38ZXYG2tbGt8ETJsIw3_7cBg
        type: string
      status:
        example: ok
        type: string
      username:
        example: jtorres
        type: string
    type: object
  admin.webLoginResponse:
    properties:
      expiresAt:
        type: string
      username:
        example: jtorres
        type: string
    type: object
  audit.Event:
    properties:
      action:
        type: string
      actor:
        type: string
      clientAddr:
        type: string
      details:
        additionalProperties: {}
        type: object
      id:
        type: integer
      occurredAt:
        type: string
      outcome:
        type: string
      statusCode:
        type: integer
      target:
        type: string
      userAgent:
        type: string
    type: object
  manager.DomainStats:
    properties:
      activeSessions:
        type: integer
      bytesSinceStart:
        type: integer
      clients:
        type: integer
      domain:
        type: string
      intranetPorts:
        items:
          type: string
        type: array
      pendingVisitors:
        type: integer
      status:
        description: '"active", "idle" or "unresponsive"'
        type: string
    type: object
  manager.RequestRecord:
    properties:
      domain:
        type: string
      durationMs:
        type: integer
      method:
        type: string
      path:
        type: string
      port:
        description: proxy port or an intranet port; 0 when unknown
        type: integer
      responseBytes:
        type: integer
      status:
        type: integer
      time:
        type: string
    type: object
info:
  contact: {}
  description: |-
    Administration of a Lipstick server: domains, live state, request log, visitor users and API tokens, and access rules.

    The API is served over TLS. The example configuration binds it to 127.0.0.1, so only the machine itself can reach it. Everything except the health check and the login endpoints needs a session: the web panel gets it from its login form, API clients from /login.

    **Accounts.** Admin accounts are created on the server machine, from the console, with a password typed in the terminal: `lipstick-server admin create -username NAME`. There is no key to configure. Without an account no change is possible. Other console commands: `admin list`, `admin reset-password -username NAME`, `admin disable -username NAME`, `admin enable -username NAME`.

    **Sessions.** `POST /login` with the account's username and password returns a token. Send it on each request as `Authorization: Bearer <token>`. The web panel uses `POST /web/login` instead, which keeps the token in an HttpOnly cookie that scripts cannot read; changes made with that cookie must carry the header `X-Lipstick-CSRF: 1`. It expires after 12 hours; `POST /logout` ends it. Five wrong passwords lock the account for 15 minutes.

    **Example with curl.** The certificate is self-signed, so use -k:

    `curl -k -X POST 'https://127.0.0.1:5052/login' -H 'Content-Type: application/json' -d '{"username": "jtorres", "password": "<your password>"}'`

    Copy the token from the answer, then:

    `curl -k -X POST 'https://127.0.0.1:5052/domains/localhost/visitor-users' -H 'Content-Type: application/json' -H 'Authorization: Bearer <token>' -d '{"username": "jtorres"}'`

    Without a valid token the answer is 401 Unauthorized.
  title: Lipstick Admin API
  version: "1.0"
paths:
  /:
    get:
      description: HTML panel that reads /stats, /requests and the daily traffic.
      produces:
      - text/html
      responses:
        "200":
          description: HTML page
          schema:
            type: string
      summary: Admin panel
      tags:
      - system
  /account:
    get:
      description: The account and role of the session making the request.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.accountInfo'
        "401":
          description: 'Missing, expired or invalid session. Error: ''Unauthorized'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
      security:
      - BearerAuth: []
      summary: Who am I
      tags:
      - accounts
  /account/password:
    post:
      consumes:
      - application/json
      description: Changes the password of the session's own account after checking
        the current one. Every session of the account ends, so the user logs in again
        with the new password.
      parameters:
      - description: Current and new password
        in: body
        name: change
        required: true
        schema:
          $ref: '#/definitions/admin.ownPasswordBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.statusResponse'
        "400":
          description: The new password is shorter than 12 characters, or the body
            is not JSON
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "401":
          description: 'Missing, expired or invalid session. Error: ''Unauthorized'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "403":
          description: 'The current password is wrong. Error: ''the current password
            is wrong'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "500":
          description: The password could not be changed
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "503":
          description: 'The change was not made: the audit log is not available'
          schema:
            $ref: '#/definitions/admin.errorResponse'
      security:
      - BearerAuth: []
      summary: Change my password
      tags:
      - accounts
  /admin-users:
    get:
      description: Every account with its role and status. Superusers only.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/admin.accountView'
            type: array
        "401":
          description: 'Missing, expired or invalid session. Error: ''Unauthorized'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "403":
          description: Only a superuser can do this
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "500":
          description: The accounts could not be listed
          schema:
            $ref: '#/definitions/admin.errorResponse'
      security:
      - BearerAuth: []
      summary: List admin accounts
      tags:
      - accounts
    post:
      consumes:
      - application/json
      description: 'Creates an account with a role: superuser (manages accounts) or
        operator (manages domains and visitor users). Superusers only. The password
        is at least 12 characters.'
      parameters:
      - description: Account to create
        in: body
        name: account
        required: true
        schema:
          $ref: '#/definitions/admin.createAccountBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.statusResponse'
        "400":
          description: Bad username, short password, role not superuser or operator,
            or malformed JSON
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "401":
          description: 'Missing, expired or invalid session. Error: ''Unauthorized'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "403":
          description: Only a superuser can do this
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "409":
          description: An account with that name already exists
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "500":
          description: The account could not be created
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "503":
          description: 'The change was not made: the audit log is not available'
          schema:
            $ref: '#/definitions/admin.errorResponse'
      security:
      - BearerAuth: []
      summary: Create an admin account
      tags:
      - accounts
  /admin-users/{username}/disable:
    post:
      description: Blocks the account and ends its sessions. You cannot disable your
        own account, and the last active superuser cannot be disabled. Superusers
        only.
      parameters:
      - description: Account name
        in: path
        name: username
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.statusResponse'
        "401":
          description: 'Missing, expired or invalid session. Error: ''Unauthorized'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "403":
          description: Only a superuser can do this
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "404":
          description: 'The account does not exist. Error: ''admin user not found'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "409":
          description: Your own account, or the last active superuser
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "500":
          description: The account could not be changed
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "503":
          description: 'The change was not made: the audit log is not available'
          schema:
            $ref: '#/definitions/admin.errorResponse'
      security:
      - BearerAuth: []
      summary: Disable an account
      tags:
      - accounts
  /admin-users/{username}/enable:
    post:
      description: Allows a disabled account to log in again. Superusers only.
      parameters:
      - description: Account name
        in: path
        name: username
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.statusResponse'
        "401":
          description: 'Missing, expired or invalid session. Error: ''Unauthorized'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "403":
          description: Only a superuser can do this
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "404":
          description: 'The account does not exist. Error: ''admin user not found'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "500":
          description: The account could not be changed
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "503":
          description: 'The change was not made: the audit log is not available'
          schema:
            $ref: '#/definitions/admin.errorResponse'
      security:
      - BearerAuth: []
      summary: Enable an account
      tags:
      - accounts
  /admin-users/{username}/password:
    post:
      consumes:
      - application/json
      description: Sets a new password for an account and ends all its sessions. Superusers
        only.
      parameters:
      - description: Account name
        in: path
        name: username
        required: true
        type: string
      - description: New password
        in: body
        name: password
        required: true
        schema:
          $ref: '#/definitions/admin.passwordBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.statusResponse'
        "400":
          description: Short password or malformed JSON
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "401":
          description: 'Missing, expired or invalid session. Error: ''Unauthorized'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "403":
          description: Only a superuser can do this
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "404":
          description: 'The account does not exist. Error: ''admin user not found'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "500":
          description: The password could not be changed
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "503":
          description: 'The change was not made: the audit log is not available'
          schema:
            $ref: '#/definitions/admin.errorResponse'
      security:
      - BearerAuth: []
      summary: Reset an account's password
      tags:
      - accounts
  /admin-users/{username}/role:
    post:
      consumes:
      - application/json
      description: Sets superuser or operator. The last active superuser cannot be
        demoted. Superusers only.
      parameters:
      - description: Account name
        in: path
        name: username
        required: true
        type: string
      - description: New role
        in: body
        name: role
        required: true
        schema:
          $ref: '#/definitions/admin.roleBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.statusResponse'
        "400":
          description: Role is not superuser or operator, or malformed JSON
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "401":
          description: 'Missing, expired or invalid session. Error: ''Unauthorized'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "403":
          description: Only a superuser can do this
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "404":
          description: 'The account does not exist. Error: ''admin user not found'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "409":
          description: At least one active superuser must remain
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "500":
          description: The role could not be changed
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "503":
          description: 'The change was not made: the audit log is not available'
          schema:
            $ref: '#/definitions/admin.errorResponse'
      security:
      - BearerAuth: []
      summary: Change an account's role
      tags:
      - accounts
  /audit:
    get:
      description: 'Every change and login attempt, newest first: who (actor), what
        (action), which object (target), the outcome, the status code, the client
        address, and the names of the fields changed. Values of keys, secrets and
        passwords are never recorded. Superusers only.'
      parameters:
      - description: Only this account
        in: query
        name: actor
        type: string
      - description: Only this action, for example domain.update
        in: query
        name: action
        type: string
      - description: Only this object
        in: query
        name: target
        type: string
      - description: pending, succeeded or failed
        in: query
        name: outcome
        type: string
      - description: 'Start: RFC 3339 or YYYY-MM-DD'
        in: query
        name: from
        type: string
      - description: 'End: RFC 3339 or YYYY-MM-DD (a date includes the whole day)'
        in: query
        name: to
        type: string
      - default: 100
        description: How many, 1 to 500
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/audit.Event'
            type: array
        "400":
          description: A parameter is not valid
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "401":
          description: 'Missing, expired or invalid session. Error: ''Unauthorized'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "403":
          description: Only a superuser can do this
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "503":
          description: The audit log does not answer
          schema:
            $ref: '#/definitions/admin.errorResponse'
      security:
      - BearerAuth: []
      summary: Search the audit log
      tags:
      - audit
  /domains:
    get:
      description: Every domain with its policies. Client keys are never returned.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/admin.domainView'
            type: array
        "500":
          description: 'The domains could not be read. Error: ''Unable to get domains'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
      security:
      - BearerAuth: []
      summary: List domains
      tags:
      - domains
    post:
      consumes:
      - application/json
      description: Registers a domain with the key its client will use. Multiple connections
        are allowed unless allowMultipleConnections is false. allowedCidrs is a list
        of networks or addresses; empty means no restriction.
      parameters:
      - description: Domain to create
        in: body
        name: domain
        required: true
        schema:
          $ref: '#/definitions/admin.domainCreateBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.statusResponse'
        "400":
          description: Invalid body. The message names the field, for example 'allowedCidrs
            must be a list of strings' or an invalid network or address
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "401":
          description: 'Missing, expired or invalid session token. Error: ''Unauthorized'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "500":
          description: 'The domain could not be saved. Error: ''Unable to add domain'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "503":
          description: 'The change was not made: the audit log is not available'
          schema:
            $ref: '#/definitions/admin.errorResponse'
      security:
      - BearerAuth: []
      summary: Create a domain
      tags:
      - domains
  /domains/{domainName}:
    delete:
      description: Removes the domain and disconnects its clients.
      parameters:
      - description: Domain name
        in: path
        name: domainName
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.statusResponse'
        "401":
          description: 'Missing, expired or invalid session token. Error: ''Unauthorized'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "404":
          description: 'The domain does not exist. Error: ''Domain not found'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "500":
          description: 'The domain could not be deleted. Error: ''Unable to delete
            domain'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "503":
          description: 'The change was not made: the audit log is not available'
          schema:
            $ref: '#/definitions/admin.errorResponse'
      security:
      - BearerAuth: []
      summary: Delete a domain
      tags:
      - domains
    get:
      description: One domain with its policies. The client key is never returned.
      parameters:
      - description: Domain name
        in: path
        name: domainName
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.domainView'
        "404":
          description: 'The domain does not exist. Error: ''Domain not found'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "500":
          description: 'The domain could not be read. Error: ''Unable to get domain'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
      security:
      - BearerAuth: []
      summary: Get one domain
      tags:
      - domains
    patch:
      consumes:
      - application/json
      description: 'Changes any of: apiKey, allowMultipleConnections, passthrough
        (not while the domain requires visitor auth), allowedCidrs (an empty list
        removes the rules), authLatched (only false: clearing the restricted mode).
        Clients of the domain are disconnected and reconnect with the new policy.'
      parameters:
      - description: Domain name
        in: path
        name: domainName
        required: true
        type: string
      - description: Fields to change; send only those
        in: body
        name: changes
        required: true
        schema:
          $ref: '#/definitions/admin.domainChangeBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.statusResponse'
        "400":
          description: 'Invalid body. The message names the field, for example ''allowMultipleConnections
            must be true or false'', ''passthrough must be true or false'', ''allowedCidrs
            must be a list of addresses or networks'', or ''authLatched can only be
            set to false: clients set the restricted mode'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "401":
          description: 'Missing, expired or invalid session token. Error: ''Unauthorized'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "404":
          description: 'The domain does not exist. Error: ''Domain not found'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "409":
          description: 'Passthrough cannot be turned on for a domain that requires
            visitor authentication. Error: ''passthrough cannot be turned on: the
            domain requires visitor authentication'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "500":
          description: 'The domain could not be updated. Error: ''Unable to update
            domain'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "503":
          description: 'The change was not made: the audit log is not available'
          schema:
            $ref: '#/definitions/admin.errorResponse'
      security:
      - BearerAuth: []
      summary: Change a domain
      tags:
      - domains
  /domains/{domainName}/traffic:
    get:
      description: Bytes transferred per day between two dates, inclusive.
      parameters:
      - description: Domain name
        in: path
        name: domainName
        required: true
        type: string
      - description: First day, YYYY-MM-DD
        in: query
        name: from
        required: true
        type: string
      - description: Last day, YYYY-MM-DD
        in: query
        name: to
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.trafficResponse'
        "400":
          description: 'Invalid date. Error: ''Invalid ''from'' parameter, use YYYY-MM-DD''
            or ''Invalid ''to'' parameter, use YYYY-MM-DD'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "500":
          description: 'The traffic could not be read. Error: ''Unable to get config'',
            ''Unable to connect to database'' or ''Unable to read traffic'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
      security:
      - BearerAuth: []
      summary: Daily traffic of a domain
      tags:
      - domains
  /domains/{domainName}/visitor-tokens:
    get:
      description: 'Tokens of a domain without their values: id, name, methods, path
        prefixes, creation time, and whether they are revoked.'
      parameters:
      - description: Domain name
        in: path
        name: domainName
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/admin.visitorTokenItem'
            type: array
        "401":
          description: 'Missing, expired or invalid session token. Error: ''Unauthorized'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "404":
          description: 'The domain does not exist. Error: ''Domain not found'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "500":
          description: 'The tokens could not be listed. Error: ''unable to list tokens'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
      security:
      - BearerAuth: []
      summary: List API tokens
      tags:
      - visitor-auth
    post:
      consumes:
      - application/json
      description: 'Creates a Bearer token with permissions: methods (or "*") and
        path prefixes. The token value is returned once; only its SHA-256 hash is
        stored. The response has no id: list the tokens to get it.'
      parameters:
      - description: Domain name
        in: path
        name: domainName
        required: true
        type: string
      - description: Name, methods and path prefixes
        in: body
        name: token
        required: true
        schema:
          $ref: '#/definitions/admin.visitorTokenBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.visitorTokenCreated'
        "400":
          description: 'Invalid body, or the token could not be created. Errors: ''token
            name must be 1 to 64 characters'', ''a token needs at least one method,
            or *'', or malformed JSON'
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "401":
          description: 'Missing, expired or invalid session token. Error: ''Unauthorized'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "404":
          description: 'The domain does not exist. Error: ''Domain not found'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "500":
          description: 'The domain could not be read. Error: ''Unable to get domain'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "503":
          description: 'The change was not made: the audit log is not available'
          schema:
            $ref: '#/definitions/admin.errorResponse'
      security:
      - BearerAuth: []
      summary: Create an API token
      tags:
      - visitor-auth
  /domains/{domainName}/visitor-tokens/{id}:
    delete:
      description: The token stops working at once.
      parameters:
      - description: Domain name
        in: path
        name: domainName
        required: true
        type: string
      - description: Token id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.statusResponse'
        "400":
          description: 'The id is not a number. Error: ''id must be a number'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "401":
          description: 'Missing, expired or invalid session token. Error: ''Unauthorized'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "404":
          description: 'The domain or the token does not exist. Errors: ''Domain not
            found'' or ''visitor token not found'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "500":
          description: 'The domain could not be read. Error: ''Unable to get domain'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "503":
          description: 'The change was not made: the audit log is not available'
          schema:
            $ref: '#/definitions/admin.errorResponse'
      security:
      - BearerAuth: []
      summary: Revoke an API token
      tags:
      - visitor-auth
  /domains/{domainName}/visitor-users:
    get:
      description: Usernames of a domain. Secrets are never returned.
      parameters:
      - description: Domain name
        in: path
        name: domainName
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: string
            type: array
        "401":
          description: 'Missing, expired or invalid session token. Error: ''Unauthorized'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "404":
          description: 'The domain does not exist. Error: ''Domain not found'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "500":
          description: 'The users could not be listed. Error: ''unable to list users'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
      security:
      - BearerAuth: []
      summary: List visitor users
      tags:
      - visitor-auth
    post:
      consumes:
      - application/json
      description: |-
        Creates a user of a restricted domain with its own secret. Send the secret in the body (at least 32 characters) or omit it: then the server generates one and returns it in this response, the only time it is shown. The user signs each request with HMAC-SHA256 using that secret and sends it in the Authorization header as LipstickHMAC user, ts, nonce and sig. Usernames: 1 to 64 letters, digits, dots, underscores, at signs or hyphens.
        Example: after logging in (see /login), curl -k -X POST 'https://127.0.0.1:5052/domains/localhost/visitor-users' -H 'Content-Type: application/json' -H 'Authorization: Bearer <token>' -d '{"username": "jtorres"}'. Without a valid token the answer is 401.
      parameters:
      - description: Domain name
        in: path
        name: domainName
        required: true
        type: string
      - description: Username and optional secret
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/admin.visitorUserBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.visitorUserResponse'
        "400":
          description: 'Invalid body, or the user could not be created. Errors: ''username
            must be 1 to 64 letters, digits, dots, underscores, at signs or hyphens'',
            ''secret must be at least 32 characters'', ''a visitor user with that
            name already exists'', or malformed JSON'
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "401":
          description: 'Missing, expired or invalid session token. Error: ''Unauthorized'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "404":
          description: 'The domain does not exist. Error: ''Domain not found'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "500":
          description: 'The domain could not be read. Error: ''Unable to get domain'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "503":
          description: 'The change was not made: the audit log is not available'
          schema:
            $ref: '#/definitions/admin.errorResponse'
      security:
      - BearerAuth: []
      summary: Add a visitor user
      tags:
      - visitor-auth
  /domains/{domainName}/visitor-users/{username}:
    delete:
      description: Removes the user; their access ends at once.
      parameters:
      - description: Domain name
        in: path
        name: domainName
        required: true
        type: string
      - description: Username
        in: path
        name: username
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.statusResponse'
        "401":
          description: 'Missing, expired or invalid session token. Error: ''Unauthorized'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "404":
          description: 'The domain or the user does not exist. Errors: ''Domain not
            found'' or ''visitor user not found'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "500":
          description: 'The domain could not be read. Error: ''Unable to get domain'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "503":
          description: 'The change was not made: the audit log is not available'
          schema:
            $ref: '#/definitions/admin.errorResponse'
      security:
      - BearerAuth: []
      summary: Delete a visitor user
      tags:
      - visitor-auth
  /domains/{domainName}/visitor-users/{username}/rotate:
    post:
      description: Replaces the secret of a user and returns the new one, shown once.
        The old secret stops working at once.
      parameters:
      - description: Domain name
        in: path
        name: domainName
        required: true
        type: string
      - description: Username
        in: path
        name: username
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.visitorUserResponse'
        "401":
          description: 'Missing, expired or invalid session token. Error: ''Unauthorized'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "404":
          description: 'The domain or the user does not exist. Errors: ''Domain not
            found'' or ''visitor user not found'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "500":
          description: 'The secret could not be rotated. Error: ''unable to rotate
            secret'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "503":
          description: 'The change was not made: the audit log is not available'
          schema:
            $ref: '#/definitions/admin.errorResponse'
      security:
      - BearerAuth: []
      summary: Rotate a visitor user's secret
      tags:
      - visitor-auth
  /health:
    get:
      description: Checks the database and, in a cluster, NATS. 200 when every check
        passes; 503 when one fails, naming the failed check without the error text.
        Needs no session.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.healthResponse'
        "503":
          description: 'At least one check failed: its value is down'
          schema:
            $ref: '#/definitions/admin.healthResponse'
      summary: Health check
      tags:
      - system
  /login:
    post:
      consumes:
      - application/json
      description: 'Checks an admin account and returns a session token. Send the
        token on every change as "Authorization: Bearer <token>". The token expires
        after 12 hours. Five wrong passwords lock the account for 15 minutes. Accounts
        are created on the server machine with: lipstick-server admin create -username
        NAME. The web panel uses /web/login instead, which keeps the token in a cookie.'
      parameters:
      - description: Account name and password
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/admin.loginBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.loginResponse'
        "400":
          description: Body is not JSON with username and password
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "401":
          description: Invalid username or password. The message does not say which
            of the two was wrong
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "429":
          description: Too many failed logins; the Retry-After header says how long
            to wait
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "500":
          description: The session could not be created
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "503":
          description: 'The change was not made: the audit log is not available'
          schema:
            $ref: '#/definitions/admin.errorResponse'
      summary: Log in
      tags:
      - session
  /logout:
    post:
      description: 'Ends the session of the token or cookie of the request. The token
        stops working at once, and the session cookie is cleared. Changes with the
        cookie need the X-Lipstick-CSRF: 1 header.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.statusResponse'
        "401":
          description: 'Missing, expired or invalid session. Error: ''Unauthorized'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "403":
          description: The X-Lipstick-CSRF header is missing on a cookie logout
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "500":
          description: The session could not be ended
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "503":
          description: 'The change was not made: the audit log is not available'
          schema:
            $ref: '#/definitions/admin.errorResponse'
      security:
      - BearerAuth: []
      summary: Log out
      tags:
      - session
  /requests:
    get:
      description: 'Finished HTTP requests, newest first, read from the database (about
        two seconds of delay): domain, port the visitor came in on, method, path without
        query, status, duration and response size. Headers and bodies are never stored.
        Without from or to, the newest requests come from memory; with a time range
        they come from the database (kept 7 days).'
      parameters:
      - description: Only this domain
        in: query
        name: domain
        type: string
      - description: 'Only this port: 5050 is the proxy, others are intranet ports'
        in: query
        name: port
        type: integer
      - default: 100
        description: How many, 1 to 500
        in: query
        name: limit
        type: integer
      - description: 'Start of the range: RFC 3339 or YYYY-MM-DD'
        in: query
        name: from
        type: string
      - description: 'End of the range: RFC 3339 or YYYY-MM-DD (a date includes the
          whole day)'
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/manager.RequestRecord'
            type: array
        "400":
          description: 'Invalid parameter. Error: ''port must be between 1 and 65535'',
            ''limit must be a positive number'', ''from must be RFC 3339 or YYYY-MM-DD'',
            ''to must be RFC 3339 or YYYY-MM-DD'', or a range error'
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "503":
          description: 'The request history is not available: the database does not
            answer'
          schema:
            $ref: '#/definitions/admin.errorResponse'
      security:
      - BearerAuth: []
      summary: Recent HTTP requests
      tags:
      - requests
  /stats:
    get:
      description: Clients, active sessions, pending visitors, bytes since start,
        and intranet ports for each domain, added up over every server of the cluster
        that reported in the last 20 seconds. Read from the database, so any server
        answers the same.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/manager.DomainStats'
            type: array
        "503":
          description: The database that holds the cluster state does not answer
          schema:
            $ref: '#/definitions/admin.errorResponse'
      security:
      - BearerAuth: []
      summary: Live state of every domain
      tags:
      - domains
  /web/login:
    post:
      consumes:
      - application/json
      description: 'The same check as /login, for the web panel. The token is not
        in the answer: it is stored in the HttpOnly, Secure, SameSite=Strict cookie
        "lipstick_session", which scripts cannot read. The request must carry the
        header X-Lipstick-CSRF: 1.'
      parameters:
      - description: Account name and password
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/admin.loginBody'
      produces:
      - application/json
      responses:
        "200":
          description: The session cookie is set
          schema:
            $ref: '#/definitions/admin.webLoginResponse'
        "400":
          description: Body is not JSON with username and password
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "401":
          description: Invalid username or password
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "403":
          description: The X-Lipstick-CSRF header is missing
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "429":
          description: Too many failed logins; the Retry-After header says how long
            to wait
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "500":
          description: The session could not be created
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "503":
          description: 'The change was not made: the audit log is not available'
          schema:
            $ref: '#/definitions/admin.errorResponse'
      summary: Log in to the web panel
      tags:
      - session
schemes:
- https
securityDefinitions:
  BearerAuth:
    description: Session token from /login, sent as "Bearer <token>".
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
