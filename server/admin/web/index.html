<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Lipstick · Admin</title>
<link rel="stylesheet" href="/admin/css/app.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" data-i18n-aria="Main navigation">
    <a class="brand" id="brand" href="#/dashboard" data-i18n-aria="Lipstick, go to the dashboard">
      <img class="brand-logo" src="/admin/img/logo.png" alt="" width="28" height="28">
      <span class="brand-name">Lipstick</span>
    </a>
    <nav id="nav" data-i18n-aria="Sections"></nav>
    <div class="sidebar-foot" data-i18n="Admin panel">Admin panel</div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div class="crumb" id="crumb"></div>
      <div class="userbox">
        <div class="menu-anchor">
          <button class="user-button" id="user-button" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="user-menu">
            <span class="avatar" id="avatar" aria-hidden="true">·</span>
            <span class="user-text">
              <span class="cell-strong" id="me-name">…</span>
              <span class="hint" id="me-role"></span>
            </span>
            <span class="chevron" aria-hidden="true">▾</span>
          </button>
          <div class="menu" id="user-menu" role="menu" hidden>
            <div class="menu-head">
              <div class="cell-strong" id="menu-name"></div>
              <div class="hint" id="menu-role"></div>
            </div>
            <button class="menu-item" type="button" role="menuitem" data-action="account" data-i18n="My account">My account</button>
            <div class="menu-sep" role="separator"></div>
            <div class="menu-group-title" data-i18n="Language">Language</div>
            <div id="menu-languages" role="group" data-i18n-aria="Language"></div>
            <div class="menu-sep" role="separator"></div>
            <button class="menu-item menu-item-danger" id="logout" type="button" role="menuitem" data-i18n="Sign out">Sign out</button>
          </div>
        </div>
      </div>
    </header>
    <main class="view" id="view" tabindex="-1"></main>
  </div>
</div>
<div id="toasts" aria-live="polite"></div>
<script src="/admin/js/i18n.js"></script>
<script src="/admin/js/core.js"></script>
<script src="/admin/js/dashboard.js"></script>
<script src="/admin/js/domains.js"></script>
<script src="/admin/js/traffic.js"></script>
<script src="/admin/js/account.js"></script>
<script src="/admin/js/accounts.js"></script>
<script src="/admin/js/visitors.js"></script>
<script src="/admin/js/audit.js"></script>
<script src="/admin/js/settings.js"></script>
<script src="/admin/js/boot.js"></script>
</body>
</html>
