<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Lipstick · Entrar</title>
<link rel="stylesheet" href="/admin/css/app.css">
<script src="/admin/js/theme.js"></script>
</head>
<body>
<main class="login-page">
  <div class="login-card">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">L</div>
      <div class="brand-name">Lipstick</div>
    </div>
    <div>
      <h1>Inicia sesión</h1>
      <p class="muted">Panel de administración del servidor.</p>
    </div>
    <form id="login-form" class="form" autocomplete="on">
      <label class="field"><span>Usuario</span>
        <input class="input" id="username" name="username" autocomplete="username" required autofocus>
      </label>
      <label class="field"><span>Contraseña</span>
        <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
      </label>
      <button class="btn btn-primary" type="submit" id="login-submit">Entrar</button>
      <div id="login-error" class="msg msg-error" role="alert"></div>
    </form>
  </div>
</main>
<script src="/admin/js/login.js"></script>
</body>
</html>
