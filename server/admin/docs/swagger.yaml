basePath: /
definitions:
  admin.dailyConsumption:
    properties:
      BytesUsed:
        example: 1048576
        type: integer
      CreatedAt:
        type: string
      Date:
        type: string
      Domain:
        example: robot.example.com
        type: string
      ID:
        example: 12
        type: integer
      Month:
        example: 2026-11
        type: string
      UpdatedAt:
        type: string
    type: object
  admin.domainChangeBody:
    properties:
      allowMultipleConnections:
        type: boolean
      allowedCidrs:
        items:
          type: string
        type: array
      apiKey:
        type: string
      authLatched:
        example: false
        type: boolean
      passthrough:
        type: boolean
    type: object
  admin.domainCreateBody:
    properties:
      allowMultipleConnections:
        example: true
        type: boolean
      allowedCidrs:
        example:
        - 10.0.0.0/8
        - 192.168.1.7
        items:
          type: string
        type: array
      apiKey:
        example: clave-del-cliente-de-al-menos-32-caracteres
        type: string
      name:
        example: robot.example.com
        type: string
      passthrough:
        example: false
        type: boolean
    type: object
  admin.domainView:
    properties:
      allowMultipleConnections:
        type: boolean
      allowedCidrs:
        items:
          type: string
        type: array
      authLatched:
        type: boolean
      id:
        type: integer
      name:
        type: string
      passthrough:
        type: boolean
    type: object
  admin.errorResponse:
    properties:
      error:
        example: message describing what went wrong
        type: string
    type: object
  admin.statusResponse:
    properties:
      status:
        example: ok
        type: string
    type: object
  admin.trafficResponse:
    properties:
      consumptions:
        items:
          $ref: '#/definitions/admin.dailyConsumption'
        type: array
      domain:
        example: robot.example.com
        type: string
      from:
        example: "2026-11-01"
        type: string
      to:
        example: "2026-11-30"
        type: string
    type: object
  admin.visitorTokenBody:
    properties:
      methods:
        items:
          type: string
        type: array
      name:
        type: string
      pathPrefixes:
        items:
          type: string
        type: array
    type: object
  admin.visitorTokenCreated:
    properties:
      name:
        example: reader
        type: string
      note:
        example: shown once; store it now
        type: string
      token:
        example: q8Vx2nqT1sK9wEZl0cHjR3pYb7LmUo4aGdNfXiTr5Ys
        type: string
    type: object
  admin.visitorTokenItem:
    properties:
      createdAt:
        type: string
      id:
        example: 3
        type: integer
      methods:
        example: GET,HEAD
        type: string
      name:
        example: reader
        type: string
      pathPrefixes:
        example: /api,/public
        type: string
      revoked:
        example: false
        type: boolean
    type: object
  admin.visitorUserBody:
    properties:
      secret:
        description: Secret is optional. If it is omitted, the server generates one
          and returns it once.
        type: string
      username:
        type: string
    type: object
  admin.visitorUserResponse:
    properties:
      secret:
        example: V_adFY98sN6seUTCMqf38ZXYG2tbGt8ETJsIw3_7cBg
        type: string
      status:
        example: ok
        type: string
      username:
        example: jtorres
        type: string
    type: object
  manager.DomainStats:
    properties:
      activeSessions:
        type: integer
      bytesSinceStart:
        type: integer
      clients:
        type: integer
      domain:
        type: string
      intranetPorts:
        items:
          type: string
        type: array
      pendingVisitors:
        type: integer
      status:
        description: '"active", "idle" or "unresponsive"'
        type: string
    type: object
  manager.RequestRecord:
    properties:
      domain:
        type: string
      durationMs:
        type: integer
      method:
        type: string
      path:
        type: string
      port:
        description: proxy port or an intranet port; 0 when unknown
        type: integer
      responseBytes:
        type: integer
      status:
        type: integer
      time:
        type: string
    type: object
info:
  contact: {}
  description: |-
    Administration of a Lipstick server: domains, live state, request log, visitor users and API tokens, and access rules.

    The API is served over TLS. The example configuration binds it to 127.0.0.1, so only the machine itself can reach it. Reads of domains, statistics and the request log need no key, which is safe only while the port is not reachable from other machines. Every change needs the admin key.

    Use the Authorize button and send the admin key from admin_secret_key in server/config.yml. It is sent as it is, without a "Bearer" prefix.

    Example with curl. The certificate is self-signed, so use -k. Replace the key with admin_secret_key from server/config.yml:

    `curl -k -X POST 'https://127.0.0.1:5052/domains/localhost/visitor-users' -H 'Content-Type: application/json' -H 'Authorization: <admin_secret_key>' -d '{"username": "jtorres"}'`

    Without the Authorization header the answer is 401 Unauthorized.
  title: Lipstick Admin API
  version: "1.0"
paths:
  /:
    get:
      description: HTML panel that reads /stats, /requests and the daily traffic.
        Needs no key.
      produces:
      - text/html
      responses:
        "200":
          description: HTML page
          schema:
            type: string
      summary: Admin panel
      tags:
      - system
  /domains:
    get:
      description: Every domain with its policies. Client keys are never returned.
        Needs no key.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/admin.domainView'
            type: array
        "500":
          description: 'The domains could not be read. Error: ''Unable to get domains'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
      summary: List domains
      tags:
      - domains
    post:
      consumes:
      - application/json
      description: Registers a domain with the key its client will use. Multiple connections
        are allowed unless allowMultipleConnections is false. allowedCidrs is a list
        of networks or addresses; empty means no restriction.
      parameters:
      - description: Domain to create
        in: body
        name: domain
        required: true
        schema:
          $ref: '#/definitions/admin.domainCreateBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.statusResponse'
        "400":
          description: Invalid body. The message names the field, for example 'allowedCidrs
            must be a list of strings' or an invalid network or address
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "401":
          description: 'Missing or wrong admin key. Error: ''Unauthorized'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "500":
          description: 'The domain could not be saved. Error: ''Unable to add domain'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
      security:
      - AdminKey: []
      summary: Create a domain
      tags:
      - domains
  /domains/{domainName}:
    delete:
      description: Removes the domain and disconnects its clients.
      parameters:
      - description: Domain name
        in: path
        name: domainName
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.statusResponse'
        "401":
          description: 'Missing or wrong admin key. Error: ''Unauthorized'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "404":
          description: 'The domain does not exist. Error: ''Domain not found'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "500":
          description: 'The domain could not be deleted. Error: ''Unable to delete
            domain'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
      security:
      - AdminKey: []
      summary: Delete a domain
      tags:
      - domains
    get:
      description: One domain with its policies. The client key is never returned.
        Needs no key.
      parameters:
      - description: Domain name
        in: path
        name: domainName
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.domainView'
        "404":
          description: 'The domain does not exist. Error: ''Domain not found'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "500":
          description: 'The domain could not be read. Error: ''Unable to get domain'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
      summary: Get one domain
      tags:
      - domains
    patch:
      consumes:
      - application/json
      description: 'Changes any of: apiKey, allowMultipleConnections, passthrough
        (not while the domain requires visitor auth), allowedCidrs (an empty list
        removes the rules), authLatched (only false: clearing the restricted mode).
        Clients of the domain are disconnected and reconnect with the new policy.'
      parameters:
      - description: Domain name
        in: path
        name: domainName
        required: true
        type: string
      - description: Fields to change; send only those
        in: body
        name: changes
        required: true
        schema:
          $ref: '#/definitions/admin.domainChangeBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.statusResponse'
        "400":
          description: 'Invalid body. The message names the field, for example ''allowMultipleConnections
            must be true or false'', ''passthrough must be true or false'', ''allowedCidrs
            must be a list of addresses or networks'', or ''authLatched can only be
            set to false: clients set the restricted mode'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "401":
          description: 'Missing or wrong admin key. Error: ''Unauthorized'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "404":
          description: 'The domain does not exist. Error: ''Domain not found'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "409":
          description: 'Passthrough cannot be turned on for a domain that requires
            visitor authentication. Error: ''passthrough cannot be turned on: the
            domain requires visitor authentication'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "500":
          description: 'The domain could not be updated. Error: ''Unable to update
            domain'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
      security:
      - AdminKey: []
      summary: Change a domain
      tags:
      - domains
  /domains/{domainName}/traffic:
    get:
      description: Bytes transferred per day between two dates, inclusive. Needs no
        key.
      parameters:
      - description: Domain name
        in: path
        name: domainName
        required: true
        type: string
      - description: First day, YYYY-MM-DD
        in: query
        name: from
        required: true
        type: string
      - description: Last day, YYYY-MM-DD
        in: query
        name: to
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.trafficResponse'
        "400":
          description: 'Invalid date. Error: ''Invalid ''from'' parameter, use YYYY-MM-DD''
            or ''Invalid ''to'' parameter, use YYYY-MM-DD'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "500":
          description: 'The traffic could not be read. Error: ''Unable to get config'',
            ''Unable to connect to database'' or ''Unable to read traffic'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
      summary: Daily traffic of a domain
      tags:
      - domains
  /domains/{domainName}/visitor-tokens:
    get:
      description: 'Tokens of a domain without their values: id, name, methods, path
        prefixes, creation time, and whether they are revoked.'
      parameters:
      - description: Domain name
        in: path
        name: domainName
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/admin.visitorTokenItem'
            type: array
        "401":
          description: 'Missing or wrong admin key. Error: ''Unauthorized'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "404":
          description: 'The domain does not exist. Error: ''Domain not found'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "500":
          description: 'The tokens could not be listed. Error: ''unable to list tokens'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
      security:
      - AdminKey: []
      summary: List API tokens
      tags:
      - visitor-auth
    post:
      consumes:
      - application/json
      description: 'Creates a Bearer token with permissions: methods (or "*") and
        path prefixes. The token value is returned once; only its SHA-256 hash is
        stored. The response has no id: list the tokens to get it.'
      parameters:
      - description: Domain name
        in: path
        name: domainName
        required: true
        type: string
      - description: Name, methods and path prefixes
        in: body
        name: token
        required: true
        schema:
          $ref: '#/definitions/admin.visitorTokenBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.visitorTokenCreated'
        "400":
          description: 'Invalid body, or the token could not be created. Errors: ''token
            name must be 1 to 64 characters'', ''a token needs at least one method,
            or *'', or malformed JSON'
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "401":
          description: 'Missing or wrong admin key. Error: ''Unauthorized'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "404":
          description: 'The domain does not exist. Error: ''Domain not found'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "500":
          description: 'The domain could not be read. Error: ''Unable to get domain'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
      security:
      - AdminKey: []
      summary: Create an API token
      tags:
      - visitor-auth
  /domains/{domainName}/visitor-tokens/{id}:
    delete:
      description: The token stops working at once.
      parameters:
      - description: Domain name
        in: path
        name: domainName
        required: true
        type: string
      - description: Token id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.statusResponse'
        "400":
          description: 'The id is not a number. Error: ''id must be a number'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "401":
          description: 'Missing or wrong admin key. Error: ''Unauthorized'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "404":
          description: 'The domain or the token does not exist. Errors: ''Domain not
            found'' or ''visitor token not found'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "500":
          description: 'The domain could not be read. Error: ''Unable to get domain'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
      security:
      - AdminKey: []
      summary: Revoke an API token
      tags:
      - visitor-auth
  /domains/{domainName}/visitor-users:
    get:
      description: Usernames of a domain. Secrets are never returned.
      parameters:
      - description: Domain name
        in: path
        name: domainName
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: string
            type: array
        "401":
          description: 'Missing or wrong admin key. Error: ''Unauthorized'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "404":
          description: 'The domain does not exist. Error: ''Domain not found'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "500":
          description: 'The users could not be listed. Error: ''unable to list users'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
      security:
      - AdminKey: []
      summary: List visitor users
      tags:
      - visitor-auth
    post:
      consumes:
      - application/json
      description: |-
        Creates a user of a restricted domain with its own secret. Send the secret in the body (at least 32 characters) or omit it: then the server generates one and returns it in this response, the only time it is shown. The user signs each request with HMAC-SHA256 using that secret and sends it in the Authorization header as LipstickHMAC user, ts, nonce and sig. Usernames: 1 to 64 letters, digits, dots, underscores, at signs or hyphens.
        Example: curl -k -X POST 'https://127.0.0.1:5052/domains/localhost/visitor-users' -H 'Content-Type: application/json' -H 'Authorization: <admin_secret_key>' -d '{"username": "jtorres"}'. Without the Authorization header the answer is 401.
      parameters:
      - description: Domain name
        in: path
        name: domainName
        required: true
        type: string
      - description: Username and optional secret
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/admin.visitorUserBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.visitorUserResponse'
        "400":
          description: 'Invalid body, or the user could not be created. Errors: ''username
            must be 1 to 64 letters, digits, dots, underscores, at signs or hyphens'',
            ''secret must be at least 32 characters'', ''a visitor user with that
            name already exists'', or malformed JSON'
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "401":
          description: 'Missing or wrong admin key. Error: ''Unauthorized'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "404":
          description: 'The domain does not exist. Error: ''Domain not found'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "500":
          description: 'The domain could not be read. Error: ''Unable to get domain'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
      security:
      - AdminKey: []
      summary: Add a visitor user
      tags:
      - visitor-auth
  /domains/{domainName}/visitor-users/{username}:
    delete:
      description: Removes the user; their access ends at once.
      parameters:
      - description: Domain name
        in: path
        name: domainName
        required: true
        type: string
      - description: Username
        in: path
        name: username
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.statusResponse'
        "401":
          description: 'Missing or wrong admin key. Error: ''Unauthorized'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "404":
          description: 'The domain or the user does not exist. Errors: ''Domain not
            found'' or ''visitor user not found'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "500":
          description: 'The domain could not be read. Error: ''Unable to get domain'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
      security:
      - AdminKey: []
      summary: Delete a visitor user
      tags:
      - visitor-auth
  /domains/{domainName}/visitor-users/{username}/rotate:
    post:
      description: Replaces the secret of a user and returns the new one, shown once.
        The old secret stops working at once.
      parameters:
      - description: Domain name
        in: path
        name: domainName
        required: true
        type: string
      - description: Username
        in: path
        name: username
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.visitorUserResponse'
        "401":
          description: 'Missing or wrong admin key. Error: ''Unauthorized'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "404":
          description: 'The domain or the user does not exist. Errors: ''Domain not
            found'' or ''visitor user not found'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "500":
          description: 'The secret could not be rotated. Error: ''unable to rotate
            secret'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
      security:
      - AdminKey: []
      summary: Rotate a visitor user's secret
      tags:
      - visitor-auth
  /health:
    get:
      description: Reports that the admin API is up. Needs no key.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.statusResponse'
      summary: Health check
      tags:
      - system
  /requests:
    get:
      description: 'Finished HTTP requests, newest first: domain, port the visitor
        came in on, method, path without query, status, duration and response size.
        Headers and bodies are never stored. Without from or to, the newest requests
        come from memory; with a time range they come from the database (kept 7 days).
        Needs no key.'
      parameters:
      - description: Only this domain
        in: query
        name: domain
        type: string
      - description: 'Only this port: 5050 is the proxy, others are intranet ports'
        in: query
        name: port
        type: integer
      - default: 100
        description: How many, 1 to 500
        in: query
        name: limit
        type: integer
      - description: 'Start of the range: RFC 3339 or YYYY-MM-DD'
        in: query
        name: from
        type: string
      - description: 'End of the range: RFC 3339 or YYYY-MM-DD (a date includes the
          whole day)'
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/manager.RequestRecord'
            type: array
        "400":
          description: 'Invalid parameter. Error: ''port must be between 1 and 65535'',
            ''limit must be a positive number'', ''from must be RFC 3339 or YYYY-MM-DD'',
            ''to must be RFC 3339 or YYYY-MM-DD'', or a range error'
          schema:
            $ref: '#/definitions/admin.errorResponse'
        "500":
          description: 'The request log could not be read. Error: ''could not read
            the request log'''
          schema:
            $ref: '#/definitions/admin.errorResponse'
      summary: Recent HTTP requests
      tags:
      - requests
  /stats:
    get:
      description: Clients, active sessions, pending visitors, bytes since start,
        and intranet ports for each domain with a hub. Needs no key.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/manager.DomainStats'
            type: array
      summary: Live state of every domain
      tags:
      - domains
schemes:
- https
securityDefinitions:
  AdminKey:
    description: Admin key, sent as it is (no "Bearer" prefix).
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
