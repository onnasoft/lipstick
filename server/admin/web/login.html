<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Lipstick · Sign in</title>
<link rel="stylesheet" href="/admin/css/app.css">
</head>
<body>
<main class="login-page">
  <div class="login-card">
    <div class="brand">
      <img class="brand-logo" src="/admin/img/logo.png" alt="" width="28" height="28">
      <span class="brand-name">Lipstick</span>
    </div>
    <div>
      <h1 data-i18n="Sign in">Sign in</h1>
      <p class="muted" data-i18n="Admin panel for the server.">Admin panel for the server.</p>
    </div>
    <form id="login-form" class="form" autocomplete="on">
      <label class="field"><span data-i18n="Username">Username</span>
        <input class="input" id="username" name="username" autocomplete="username" required autofocus>
      </label>
      <label class="field"><span data-i18n="Password">Password</span>
        <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
      </label>
      <button class="btn btn-primary" type="submit" id="login-submit" data-i18n="Sign in">Sign in</button>
      <div id="login-error" class="msg msg-error" role="alert"></div>
    </form>
  </div>
</main>
<script src="/admin/js/i18n.js"></script>
<script src="/admin/js/login.js"></script>
</body>
</html>
